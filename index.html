<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片剪裁器</title>
<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* 天蓝 - 蓝配色 */
  --sky-light:   #e3f2fd;
  --sky-surface: #bbdefb;
  --sky-primary: #42a5f5;
  --blue-accent: #1e88e5;
  --blue-deep:   #0d47a1;
  --blue-dark:   #0a1929;

  /* 中性色 */
  --gray-50:  #f8fafc;
  --gray-100: #f1f5f9;
  --gray-200: #e2e8f0;
  --gray-300: #cbd5e1;
  --gray-400: #94a3b8;
  --gray-500: #64748b;
  --gray-600: #475569;
  --gray-700: #334155;
  --gray-800: #1e293b;
  --gray-900: #0f172a;

  /* 圆角 */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;

  /* 阴影 */
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 6px rgba(0,0,0,0.07), 0 2px 4px rgba(0,0,0,0.06);
  --shadow-lg: 0 10px 15px rgba(0,0,0,0.1), 0 4px 6px rgba(0,0,0,0.05);
  --shadow-xl: 0 20px 25px rgba(0,0,0,0.1), 0 10px 10px rgba(0,0,0,0.04);

  /* 过渡 */
  --transition: 0.2s ease;
}

html, body {
  height: 100%;
  font-family: "Segoe UI Variable", "Segoe UI", "PingFang SC",
               "Microsoft YaHei", system-ui, sans-serif;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  color: var(--gray-800);
  background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 30%, #e8eaf6 70%, #f1f5f9 100%);
  background-attachment: fixed;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

/* ===== App Layout ===== */
.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 1400px;
  margin: 0 auto;
  padding: 12px 16px;
  gap: 10px;
}

/* ===== Toolbar ===== */
.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.6);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  flex-shrink: 0;
  flex-wrap: wrap;
}

.toolbar__brand {
  font-size: 20px;
  font-weight: 600;
  color: var(--blue-deep);
  letter-spacing: 1px;
  white-space: nowrap;
  margin-right: 8px;
}

.toolbar__divider {
  width: 1px;
  height: 24px;
  background: var(--gray-300);
  margin: 0 4px;
}

.toolbar__btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  font-size: 15px;
  font-weight: 500;
  color: var(--gray-700);
  background: rgba(255,255,255,0.8);
  border: 1px solid var(--gray-200);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
  font-family: inherit;
}

.toolbar__btn:hover {
  background: var(--sky-light);
  border-color: var(--sky-primary);
  color: var(--blue-deep);
}

.toolbar__btn--primary {
  color: #fff;
  background: var(--sky-primary);
  border-color: var(--sky-primary);
}

.toolbar__btn--primary:hover {
  background: var(--blue-accent);
  border-color: var(--blue-accent);
  color: #fff;
}

.toolbar__btn:active {
  transform: scale(0.97);
}

/* ===== Mode Toggle (Segmented Control) ===== */
.mode-toggle {
  display: flex;
  background: rgba(0,0,0,0.04);
  border-radius: var(--radius-sm);
  padding: 3px;
  gap: 2px;
}

.mode-toggle__btn {
  padding: 6px 18px;
  font-size: 15px;
  font-weight: 500;
  color: var(--gray-600);
  background: transparent;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: all var(--transition);
  font-family: inherit;
  white-space: nowrap;
}

.mode-toggle__btn:hover {
  color: var(--gray-800);
}

.mode-toggle__btn--active {
  color: var(--blue-deep);
  background: #fff;
  box-shadow: var(--shadow-sm);
}

/* ===== Sidebar Sections ===== */
.sidebar__section {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.sidebar__label {
  font-size: 13px;
  font-weight: 600;
  color: var(--gray-500);
}

.sidebar__input {
  padding: 8px 12px;
  font-size: 15px;
  font-family: inherit;
  border: 1px solid var(--gray-200);
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.9);
  color: var(--gray-800);
  outline: none;
  transition: border-color var(--transition);
  width: 100%;
}

.sidebar__input:focus {
  border-color: var(--sky-primary);
  box-shadow: 0 0 0 3px rgba(66,165,245,0.15);
}

.sidebar__presets {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.sidebar__preset {
  padding: 5px 10px;
  font-size: 13px;
  font-family: inherit;
  font-weight: 500;
  color: var(--gray-600);
  background: rgba(255,255,255,0.8);
  border: 1px solid var(--gray-200);
  border-radius: 6px;
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
}

.sidebar__preset:hover {
  background: var(--sky-light);
  border-color: var(--sky-primary);
  color: var(--blue-deep);
}

.sidebar__row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.sidebar__row .sidebar__input {
  flex: 1;
  min-width: 0;
}

.sidebar__dim-sep {
  color: var(--gray-400);
  font-size: 14px;
  font-weight: 500;
  flex-shrink: 0;
}

.sidebar__checkbox {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--gray-600);
  cursor: pointer;
}

.sidebar__checkbox input {
  width: 16px;
  height: 16px;
  accent-color: var(--sky-primary);
}

/* ===== Main ===== */
.main {
  display: flex;
  flex: 1;
  gap: 10px;
  min-height: 0;
}

/* ===== Canvas Container ===== */
.canvas-container {
  flex: 1;
  position: relative;
  background: rgba(255,255,255,0.5);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.6);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.canvas-container__empty {
  text-align: center;
  color: var(--gray-400);
}

.canvas-container__empty p {
  font-size: 17px;
  font-weight: 500;
  margin-bottom: 4px;
}

.canvas-container__empty span {
  font-size: 14px;
  color: var(--gray-400);
}

.canvas-container canvas {
  display: block;
}

/* ===== Sidebar (placeholder for later) ===== */
.sidebar {
  width: 260px;
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.6);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  flex-shrink: 0;
  overflow-y: auto;
}

.sidebar__title {
  font-size: 15px;
  font-weight: 600;
  color: var(--gray-500);
}

/* ===== Status Bar ===== */
.statusbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 16px;
  font-size: 13px;
  color: var(--gray-500);
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.5);
  border-radius: var(--radius-sm);
  flex-shrink: 0;
}

.statusbar__left,
.statusbar__right {
  display: flex;
  align-items: center;
  gap: 16px;
}
</style>
</head>
<body>

<!-- ===== 应用容器 ===== -->
<div class="app">

  <!-- 工具栏 -->
  <header class="toolbar">
    <span class="toolbar__brand">图片剪裁器</span>

    <span class="toolbar__divider"></span>

    <!-- 模式切换 -->
    <div class="mode-toggle" id="modeToggle">
      <button class="mode-toggle__btn mode-toggle__btn--active" data-mode="crop">裁剪</button>
      <button class="mode-toggle__btn" data-mode="resize">缩放</button>
    </div>

    <span class="toolbar__divider"></span>

    <!-- 文件操作 -->
    <button class="toolbar__btn toolbar__btn--primary" id="btnOpen" title="打开图片">
      打开图片
    </button>
    <button class="toolbar__btn toolbar__btn--primary" id="btnSave" title="保存裁剪结果" disabled>
      保存结果
    </button>

    <span class="toolbar__divider"></span>

    <!-- 裁剪操作 -->
    <button class="toolbar__btn" id="btnReset" title="重置" disabled>
      重置
    </button>
  </header>

  <!-- 主体区域 -->
  <main class="main">
    <!-- 画布容器 -->
    <div class="canvas-container" id="canvasContainer">
      <div class="canvas-container__empty" id="emptyState">
        <p>打开一张图片开始裁剪</p>
        <span>支持 JPG、PNG、WebP、BMP 等常见格式</span>
      </div>
    </div>

    <!-- 右侧面板 -->
    <aside class="sidebar" id="sidebar">

      <!-- 裁剪模式面板 -->
      <div id="panelCrop" class="sidebar__section">
        <div class="sidebar__title">裁剪设置</div>

        <div class="sidebar__section">
          <label class="sidebar__label">比例锁定</label>
          <select class="sidebar__input" id="selRatio">
            <option value="free">自由比例</option>
            <option value="1:1">1:1 正方形</option>
            <option value="4:3">4:3</option>
            <option value="3:2">3:2</option>
            <option value="16:9">16:9 横屏</option>
            <option value="9:16">9:16 竖屏</option>
            <option value="custom">自定义...</option>
          </select>
          <div id="customRatioRow" class="sidebar__row" style="display:none; margin-top:4px;">
            <input class="sidebar__input" id="customRatioW" type="number" min="1" max="100" placeholder="宽" value="16" style="width:60px;">
            <span class="sidebar__dim-sep">:</span>
            <input class="sidebar__input" id="customRatioH" type="number" min="1" max="100" placeholder="高" value="9" style="width:60px;">
          </div>
        </div>

        <div class="sidebar__section" id="cropInfoSection" style="display:none;">
          <label class="sidebar__label">裁剪区域</label>
          <div id="cropInfo" style="font-size:13px; color: var(--gray-600);"></div>
        </div>
      </div>

      <!-- 缩放模式面板 -->
      <div id="panelResize" class="sidebar__section" style="display:none;">
        <div class="sidebar__title">缩放设置</div>

        <div class="sidebar__section">
          <label class="sidebar__label">目标尺寸（像素）</label>
          <div class="sidebar__row">
            <input class="sidebar__input" id="resizeWidth" type="number" min="1" max="10000" placeholder="宽" value="800">
            <span class="sidebar__dim-sep">×</span>
            <input class="sidebar__input" id="resizeHeight" type="number" min="1" max="10000" placeholder="高" value="600">
          </div>
          <label class="sidebar__checkbox">
            <input type="checkbox" id="resizeKeepRatio" checked>
            保持原图宽高比
          </label>
        </div>

        <div class="sidebar__section">
          <label class="sidebar__label">预设尺寸</label>
          <div class="sidebar__presets">
            <button class="sidebar__preset" data-w="800" data-h="600">800×600</button>
            <button class="sidebar__preset" data-w="1024" data-h="768">1024×768</button>
            <button class="sidebar__preset" data-w="333" data-h="500">333×500</button>
            <button class="sidebar__preset" data-w="500" data-h="333">500×333</button>
            <button class="sidebar__preset" data-w="1920" data-h="1080">1920×1080</button>
            <button class="sidebar__preset" data-w="1080" data-h="1920">1080×1920</button>
          </div>
        </div>
      </div>

      <!-- 未加载图片提示 -->
      <div id="sidebarEmpty" style="font-size:13px; color: var(--gray-400);">尚未加载图片</div>
    </aside>
  </main>

  <!-- 状态栏 -->
  <footer class="statusbar">
    <div class="statusbar__left">
      <span id="statusFile">未打开文件</span>
    </div>
    <div class="statusbar__right">
      <span id="statusSize">—</span>
    </div>
  </footer>
</div>

<!-- 隐藏的文件选择器（兜底用） -->
<input type="file" id="fileInput" accept="image/*" style="display:none">

<script>
// ===== 应用状态 =====
const state = {
  mode: 'crop',            // 'crop' | 'resize'
  sourceImage: null,       // 原始图片 Image 对象
  imageFile: null,         // 原始文件句柄
  imageFileName: '',       // 原始文件名

  // 缩放后的图片显示参数（canvas 坐标系）
  imageDisplay: {
    x: 0, y: 0,            // 图片在 canvas 上的左上角
    width: 0, height: 0,   // 图片在 canvas 上的显示尺寸
    scale: 1,              // 图片缩放比例 = displayWidth / naturalWidth
  },

  // 裁剪区域（原始图片像素坐标）
  crop: {
    active: false,
    x: 0, y: 0,            // 裁剪区域左上角
    width: 0, height: 0,  // 裁剪区域尺寸
    aspectRatio: null,     // null = 自由比例
  },

  // 拖拽状态
  dragging: false,
  dragStart: { x: 0, y: 0 },
  dragTarget: null,        // 'new' | 'move' | handle-name
  cropBeforeDrag: null,    // 拖拽前的裁剪区域快照
};

// ===== DOM 引用 =====
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

const dom = {
  // 工具栏
  btnOpen:    $('#btnOpen'),
  btnSave:    $('#btnSave'),
  btnReset:   $('#btnReset'),
  modeToggle: $('#modeToggle'),

  // 画布
  container:  $('#canvasContainer'),
  emptyState: $('#emptyState'),

  // 裁剪面板
  panelCrop:       $('#panelCrop'),
  selRatio:        $('#selRatio'),
  customRatioRow:  $('#customRatioRow'),
  customRatioW:    $('#customRatioW'),
  customRatioH:    $('#customRatioH'),
  cropInfoSection: $('#cropInfoSection'),
  cropInfo:        $('#cropInfo'),

  // 缩放面板
  panelResize:   $('#panelResize'),
  resizeWidth:   $('#resizeWidth'),
  resizeHeight:  $('#resizeHeight'),
  resizeKeepRatio: $('#resizeKeepRatio'),

  // 侧边栏
  sidebarEmpty: $('#sidebarEmpty'),

  // 状态栏
  statusFile: $('#statusFile'),
  statusSize: $('#statusSize'),

  // 隐藏的 file input
  fileInput: $('#fileInput'),
};

// ===== 模式切换 =====
function setMode(mode) {
  state.mode = mode;

  // 更新模式按钮状态
  $$('.mode-toggle__btn').forEach(btn => {
    btn.classList.toggle('mode-toggle__btn--active', btn.dataset.mode === mode);
  });

  // 切换侧边栏面板
  const hasImage = state.sourceImage !== null;
  dom.panelCrop.style.display = mode === 'crop' && hasImage ? '' : 'none';
  dom.panelResize.style.display = mode === 'resize' && hasImage ? '' : 'none';
  dom.sidebarEmpty.style.display = hasImage ? 'none' : '';

  // 更新重置按钮文字
  dom.btnReset.textContent = mode === 'crop' ? '重置裁剪' : '重置尺寸';

  // 刷新预览
  if (hasImage) drawPreview();
}

dom.modeToggle.addEventListener('click', (e) => {
  const btn = e.target.closest('.mode-toggle__btn');
  if (!btn) return;
  setMode(btn.dataset.mode);
});

// ===== Canvas 元素 =====
const canvas = document.createElement('canvas');
canvas.style.display = 'none';
dom.container.appendChild(canvas);
const ctx = canvas.getContext('2d');

// ===== 工具函数 =====
function formatBytes(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

// ===== 图片加载 =====
async function loadImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片加载失败')); };
    img.src = url;
  });
}

async function openImage() {
  // 优先使用 File System Access API
  if (window.showOpenFilePicker) {
    try {
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: '图片', accept: { 'image/*': ['.png','.jpg','.jpeg','.webp','.bmp','.gif'] } }],
        multiple: false,
      });
      const file = await handle.getFile();
      await loadImageFile(file);
      return;
    } catch (err) {
      // 用户取消选择，静默返回
      if (err.name === 'AbortError') return;
      console.warn('File System Access API 失败，回退到文件选择器:', err);
    }
  }
  // 回退：触发隐藏的 file input
  dom.fileInput.click();
}

async function loadImageFile(file) {
  try {
    const img = await loadImage(file);

    state.sourceImage = img;
    state.imageFileName = file.name;

    // 重置裁剪区域
    state.crop = {
      active: false,
      x: 0, y: 0,
      width: 0, height: 0,
      aspectRatio: null,
    };

    // 计算图片显示参数
    fitImageToContainer();

    // 显示 canvas，隐藏空状态
    canvas.style.display = 'block';
    dom.emptyState.style.display = 'none';

    // 绘制预览
    drawPreview();

    // 更新 UI
    updateUIAfterLoad(file);

    console.log('图片已加载:', file.name, img.naturalWidth + '×' + img.naturalHeight);
  } catch (err) {
    console.error('加载图片出错:', err);
    alert('无法加载图片，请确认文件格式正确。');
  }
}

function fitImageToContainer() {
  const img = state.sourceImage;
  const dpr = window.devicePixelRatio || 1;
  const cw = dom.container.clientWidth;
  const ch = dom.container.clientHeight;

  // canvas 内部分辨率按 DPR 乘以像素密度，避免模糊
  canvas.width = cw * dpr;
  canvas.height = ch * dpr;
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // 以下计算使用逻辑像素（与 CSS 一致）
  const padding = 40;
  const maxW = cw - padding * 2;
  const maxH = ch - padding * 2;
  const scale = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight, 1);

  const displayW = img.naturalWidth * scale;
  const displayH = img.naturalHeight * scale;

  state.imageDisplay = {
    x: (cw - displayW) / 2,
    y: (ch - displayH) / 2,
    width: displayW,
    height: displayH,
    scale: scale,
  };
}

// ===== 预览绘制 =====
function drawPreview() {
  if (!state.sourceImage) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (state.mode === 'resize') {
    drawResizePreview();
  } else {
    drawCropPreview();
  }
}

function drawCropPreview() {
  const { x, y, width, height } = state.imageDisplay;
  const img = state.sourceImage;
  ctx.drawImage(img, x, y, width, height);

  if (state.crop.active) {
    drawCropOverlay();
  }
}

function drawResizePreview() {
  const img = state.sourceImage;
  const dpr = window.devicePixelRatio || 1;
  const cw = canvas.width / dpr;
  const ch = canvas.height / dpr;

  // 读取当前目标尺寸
  const tw = parseInt(dom.resizeWidth.value) || img.naturalWidth;
  const th = parseInt(dom.resizeHeight.value) || img.naturalHeight;

  // 将预览缩放到适合容器
  const padding = 60;
  const maxW = cw - padding * 2;
  const maxH = ch - padding * 2;
  const scale = Math.min(maxW / tw, maxH / th, 1);
  const px = (cw - tw * scale) / 2;
  const py = (ch - th * scale) / 2;

  // 淡化原图作为背景参照
  ctx.globalAlpha = 0.15;
  ctx.drawImage(img, state.imageDisplay.x, state.imageDisplay.y,
    state.imageDisplay.width, state.imageDisplay.height);
  ctx.globalAlpha = 1;

  // 绘制缩放后预览
  ctx.drawImage(img, 0, 0, img.naturalWidth, img.naturalHeight, px, py, tw * scale, th * scale);

  // 预览尺寸标签
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  const label = '预览  ' + tw + ' × ' + th + ' px';
  ctx.font = '13px "Segoe UI Variable", "Microsoft YaHei", sans-serif';
  const lm = ctx.measureText(label);
  ctx.fillRect(px, py - 28, lm.width + 20, 26);
  ctx.fillStyle = '#fff';
  ctx.fillText(label, px + 10, py - 10);
}

function drawCropOverlay() {
  const { x, y, width, height, scale } = state.imageDisplay;
  const crop = state.crop;

  // 裁剪框在 canvas 上的坐标
  const cx = x + crop.x * scale;
  const cy = y + crop.y * scale;
  const cw = crop.width * scale;
  const ch = crop.height * scale;

  // 暗色遮罩（四个矩形围绕裁剪框）
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(0, 0, canvas.width, cy);                        // 上
  ctx.fillRect(0, cy, cx, ch);                                  // 左
  ctx.fillRect(cx + cw, cy, canvas.width - cx - cw, ch);        // 右
  ctx.fillRect(0, cy + ch, canvas.width, canvas.height - cy - ch); // 下

  // 裁剪框边框
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 3]);
  ctx.strokeRect(cx, cy, cw, ch);
  ctx.setLineDash([]);
}

function updateUIAfterLoad(file) {
  // 启用按钮
  dom.btnSave.disabled = false;
  dom.btnReset.disabled = false;

  // 状态栏
  dom.statusFile.textContent = file.name;
  dom.statusSize.textContent =
    state.sourceImage.naturalWidth + ' × ' + state.sourceImage.naturalHeight +
    ' | ' + formatBytes(file.size);

  // 侧边栏
  dom.sidebarEmpty.style.display = 'none';
  if (state.mode === 'crop') {
    dom.panelCrop.style.display = '';
    dom.panelResize.style.display = 'none';
  } else {
    dom.panelCrop.style.display = 'none';
    dom.panelResize.style.display = '';
  }

  // 缩放模式：初始化输出尺寸为原图尺寸
  dom.resizeWidth.value = state.sourceImage.naturalWidth;
  dom.resizeHeight.value = state.sourceImage.naturalHeight;
}

// ===== 事件绑定 =====
dom.btnOpen.addEventListener('click', openImage);

// 重置按钮
dom.btnReset.addEventListener('click', () => {
  if (state.mode === 'crop') {
    resetCrop();
    updateCropInfo();
  } else {
    if (state.sourceImage) {
      dom.resizeWidth.value = state.sourceImage.naturalWidth;
      dom.resizeHeight.value = state.sourceImage.naturalHeight;
    }
  }
  drawPreview();
});

// ===== 保存 =====
function getSuggestedFileName() {
  const original = state.imageFileName;
  const dot = original.lastIndexOf('.');
  const name = dot > -1 ? original.slice(0, dot) : original;
  const ext  = dot > -1 ? original.slice(dot) : '.png';
  return name + '-修改后' + ext;
}

async function saveResult() {
  if (!state.sourceImage) return;

  const img = state.sourceImage;

  // 根据模式确定输出尺寸
  let outW, outH;
  let useCrop = false;

  if (state.mode === 'crop') {
    if (!state.crop.active || state.crop.width < 1 || state.crop.height < 1) {
      alert('请先在图片上拖拽创建裁剪区域');
      return;
    }
    outW = state.crop.width;
    outH = state.crop.height;
    useCrop = true;
  } else {
    outW = parseInt(dom.resizeWidth.value) || img.naturalWidth;
    outH = parseInt(dom.resizeHeight.value) || img.naturalHeight;

    if (dom.resizeKeepRatio.checked) {
      const ratio = img.naturalWidth / img.naturalHeight;
      if (outW && !dom.resizeHeight.value) {
        outH = Math.round(outW / ratio);
      } else if (outH && !dom.resizeWidth.value) {
        outW = Math.round(outH * ratio);
      }
    }
  }

  // 用离屏 canvas 生成输出图片
  const out = document.createElement('canvas');
  out.width = outW;
  out.height = outH;
  const octx = out.getContext('2d');

  if (useCrop) {
    // 9 参数 drawImage: 裁剪 + 等比输出
    octx.drawImage(
      img,
      state.crop.x, state.crop.y, state.crop.width, state.crop.height,
      0, 0, outW, outH,
    );
  } else {
    octx.drawImage(img, 0, 0, outW, outH);
  }

  // 转为 blob
  const blob = await new Promise(resolve => out.toBlob(resolve, 'image/png'));

  // 保存
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: getSuggestedFileName(),
        types: [
          { description: 'PNG 图片', accept: { 'image/png': ['.png'] } },
          { description: 'JPEG 图片', accept: { 'image/jpeg': ['.jpg', '.jpeg'] } },
        ],
      });
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      console.log('已保存:', handle.name);
    } catch (err) {
      if (err.name === 'AbortError') return;
      console.error('保存失败:', err);
      fallbackDownload(blob);
    }
  } else {
    fallbackDownload(blob);
  }
}

function fallbackDownload(blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = getSuggestedFileName();
  a.click();
  URL.revokeObjectURL(url);
}

dom.btnSave.addEventListener('click', saveResult);

// ===== 缩放模式交互 =====
function onResizeInputChange() {
  if (state.mode !== 'resize' || !state.sourceImage) return;

  let tw = parseInt(dom.resizeWidth.value) || state.sourceImage.naturalWidth;
  let th = parseInt(dom.resizeHeight.value) || state.sourceImage.naturalHeight;

  if (dom.resizeKeepRatio.checked) {
    const ratio = state.sourceImage.naturalWidth / state.sourceImage.naturalHeight;
    // 判断哪个输入框最后被修改
    if (document.activeElement === dom.resizeWidth) {
      th = Math.round(tw / ratio);
      dom.resizeHeight.value = th;
    } else if (document.activeElement === dom.resizeHeight) {
      tw = Math.round(th * ratio);
      dom.resizeWidth.value = tw;
    }
  }

  drawPreview();
}

dom.resizeWidth.addEventListener('input', onResizeInputChange);
dom.resizeHeight.addEventListener('input', onResizeInputChange);
dom.resizeKeepRatio.addEventListener('change', () => {
  if (dom.resizeKeepRatio.checked && state.sourceImage) {
    // 重新以宽度为基准计算高度
    const tw = parseInt(dom.resizeWidth.value) || state.sourceImage.naturalWidth;
    const ratio = state.sourceImage.naturalWidth / state.sourceImage.naturalHeight;
    dom.resizeHeight.value = Math.round(tw / ratio);
  }
  drawPreview();
});

// 预设尺寸按钮
dom.panelResize.addEventListener('click', (e) => {
  const btn = e.target.closest('.sidebar__preset');
  if (!btn) return;
  const w = parseInt(btn.dataset.w);
  const h = parseInt(btn.dataset.h);
  if (w && h) {
    dom.resizeWidth.value = w;
    dom.resizeHeight.value = h;
    dom.resizeKeepRatio.checked = false;
    drawPreview();
  }
});


dom.fileInput.addEventListener('change', () => {
  const file = dom.fileInput.files[0];
  if (file) loadImageFile(file);
  dom.fileInput.value = ''; // 清空以允许重新选择同一文件
});

// 窗口大小变化时重新适配
window.addEventListener('resize', () => {
  if (state.sourceImage) {
    fitImageToContainer();
    drawPreview();
  }
});

// ===== 裁剪框交互 =====
function canvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

// 将 canvas 坐标转为原图像素坐标
function toImageCoords(cx, cy) {
  const d = state.imageDisplay;
  return {
    x: (cx - d.x) / d.scale,
    y: (cy - d.y) / d.scale,
  };
}

// 将原图像素坐标转为 canvas 坐标
function toCanvasCoords(ix, iy) {
  const d = state.imageDisplay;
  return {
    x: d.x + ix * d.scale,
    y: d.y + iy * d.scale,
  };
}

// 检测 canvas 坐标是否在裁剪框内
function hitCropBox(cx, cy) {
  if (!state.crop.active) return false;
  const box = toCanvasCoords(state.crop.x, state.crop.y);
  const bw = state.crop.width * state.imageDisplay.scale;
  const bh = state.crop.height * state.imageDisplay.scale;
  return cx >= box.x && cx <= box.x + bw && cy >= box.y && cy <= box.y + bh;
}

// 根据比例约束调整裁剪框
function constrainCropByRatio(crop) {
  if (!crop.aspectRatio) return;
  const ratio = crop.aspectRatio;
  // 以宽度为基准调整高度
  crop.height = crop.width / ratio;
}

canvas.addEventListener('pointerdown', (e) => {
  if (!state.sourceImage || state.mode !== 'crop') return;

  const pt = canvasCoords(e);
  const imgPt = toImageCoords(pt.x, pt.y);
  const img = state.sourceImage;

  // 检查是否在图片范围内
  if (pt.x < state.imageDisplay.x || pt.x > state.imageDisplay.x + state.imageDisplay.width ||
      pt.y < state.imageDisplay.y || pt.y > state.imageDisplay.y + state.imageDisplay.height) {
    return;
  }

  if (hitCropBox(pt.x, pt.y)) {
    // 移动已有裁剪框
    state.dragging = true;
    state.dragTarget = 'move';
    state.dragStart = imgPt;
    state.cropBeforeDrag = { ...state.crop };
  } else {
    // 新建裁剪框
    state.dragging = true;
    state.dragTarget = 'new';
    state.dragStart = imgPt;
    state.crop = {
      active: true,
      x: imgPt.x,
      y: imgPt.y,
      width: 0,
      height: 0,
      aspectRatio: getAspectRatio(),
    };
    state.cropBeforeDrag = null;
  }

  canvas.setPointerCapture(e.pointerId);
  drawPreview();
});

canvas.addEventListener('pointermove', (e) => {
  if (!state.dragging || !state.sourceImage) return;

  const pt = canvasCoords(e);
  const imgPt = toImageCoords(pt.x, pt.y);
  const img = state.sourceImage;

  // 限制在图片范围内
  const clampX = Math.max(0, Math.min(img.naturalWidth, imgPt.x));
  const clampY = Math.max(0, Math.min(img.naturalHeight, imgPt.y));

  if (state.dragTarget === 'move') {
    const dx = clampX - state.dragStart.x;
    const dy = clampY - state.dragStart.y;
    const prev = state.cropBeforeDrag;

    let newX = prev.x + dx;
    let newY = prev.y + dy;

    // 不超出图片边界
    if (newX < 0) newX = 0;
    if (newY < 0) newY = 0;
    if (newX + prev.width > img.naturalWidth) newX = img.naturalWidth - prev.width;
    if (newY + prev.height > img.naturalHeight) newY = img.naturalHeight - prev.height;

    state.crop.x = newX;
    state.crop.y = newY;
  } else if (state.dragTarget === 'new') {
    const sx = state.dragStart.x;
    const sy = state.dragStart.y;

    let w = clampX - sx;
    let h = clampY - sy;

    // 支持从右下以外的方向拖拽
    if (w < 0) { state.crop.x = clampX; w = -w; } else { state.crop.x = sx; }
    if (h < 0) { state.crop.y = clampY; h = -h; } else { state.crop.y = sy; }

    state.crop.width = w;
    state.crop.height = h;

    // 应用比例约束
    if (state.crop.aspectRatio) {
      constrainCropByRatio(state.crop);
    }
  }

  // 更新侧边栏信息
  updateCropInfo();
  drawPreview();
});

canvas.addEventListener('pointerup', (e) => {
  if (!state.dragging) return;

  state.dragging = false;
  state.dragTarget = null;
  state.cropBeforeDrag = null;
  canvas.releasePointerCapture(e.pointerId);

  // 如果裁剪框太小，取消
  if (state.crop.active && (state.crop.width < 5 || state.crop.height < 5)) {
    state.crop.active = false;
    state.crop.width = 0;
    state.crop.height = 0;
  }

  updateCropInfo();
  drawPreview();
});

canvas.addEventListener('pointerleave', () => {
  if (state.dragging) {
    state.dragging = false;
    state.dragTarget = null;
    state.cropBeforeDrag = null;
    drawPreview();
  }
});

// 更新光标样式
canvas.addEventListener('pointermove', (e) => {
  if (state.dragging || !state.sourceImage || state.mode !== 'crop') return;
  const pt = canvasCoords(e);
  if (hitCropBox(pt.x, pt.y)) {
    canvas.style.cursor = 'move';
  } else {
    canvas.style.cursor = 'crosshair';
  }
});

// ===== 比例锁定 =====
function getAspectRatio() {
  const val = dom.selRatio.value;
  if (val === 'free') return null;
  if (val === 'custom') return getCustomAspectRatio();
  const [w, h] = val.split(':').map(Number);
  return w / h;
}

function getCustomAspectRatio() {
  const w = parseInt(dom.customRatioW.value) || 16;
  const h = parseInt(dom.customRatioH.value) || 9;
  return w / h;
}

function resetCrop() {
  state.crop = {
    active: false,
    x: 0, y: 0,
    width: 0, height: 0,
    aspectRatio: state.crop.aspectRatio,
  };
}

dom.selRatio.addEventListener('change', () => {
  const val = dom.selRatio.value;

  // 显示/隐藏自定义比例输入
  dom.customRatioRow.style.display = val === 'custom' ? '' : 'none';

  // 切换比例时清除已有裁剪框，让用户重新拖拽
  state.crop.aspectRatio = val === 'custom' ? getCustomAspectRatio() : getAspectRatio();
  resetCrop();
  updateCropInfo();
  drawPreview();
});

// 自定义比例输入变化时更新
dom.customRatioW.addEventListener('input', () => {
  if (dom.selRatio.value === 'custom') {
    state.crop.aspectRatio = getCustomAspectRatio();
    resetCrop();
    drawPreview();
  }
});
dom.customRatioH.addEventListener('input', () => {
  if (dom.selRatio.value === 'custom') {
    state.crop.aspectRatio = getCustomAspectRatio();
    resetCrop();
    drawPreview();
  }
});

function updateCropInfo() {
  if (state.crop.active) {
    dom.cropInfoSection.style.display = '';
    dom.cropInfo.innerHTML =
      'X: ' + Math.round(state.crop.x) + ' &nbsp; Y: ' + Math.round(state.crop.y) + '<br>' +
      '宽: ' + Math.round(state.crop.width) + ' &nbsp; 高: ' + Math.round(state.crop.height);
  } else {
    dom.cropInfoSection.style.display = 'none';
  }
}

// ===== 初始化 =====
setMode('crop');
console.log('图片剪裁器 v0.1 — 双模式就绪，图片加载就绪');
</script>
